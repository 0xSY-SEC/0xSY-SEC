name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Generate cyan light and dark graphs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d/settings.json

      - name: Publish graphs to the output branch
        run: |
          set -euo pipefail
          test -f profile-3d-contrib/profile-cyan-light.svg
          test -f profile-3d-contrib/profile-cyan-dark.svg
          mkdir -p /tmp/profile-3d-contrib
          cp profile-3d-contrib/profile-cyan-light.svg /tmp/profile-3d-contrib/
          cp profile-3d-contrib/profile-cyan-dark.svg /tmp/profile-3d-contrib/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin output
          for attempt in 1 2 3 4 5; do
            git checkout -B output origin/output
            mkdir -p profile-3d-contrib
            cp /tmp/profile-3d-contrib/profile-cyan-light.svg profile-3d-contrib/
            cp /tmp/profile-3d-contrib/profile-cyan-dark.svg profile-3d-contrib/
            git add profile-3d-contrib/profile-cyan-light.svg profile-3d-contrib/profile-cyan-dark.svg
            if git diff --cached --quiet; then
              echo "3d graphs unchanged"
              exit 0
            fi
            git commit -m "chore: update 3d contribution graph"
            if git push origin output; then
              exit 0
            fi
            echo "push raced, retry ${attempt}"
            sleep $((attempt * 3))
            git fetch origin output
          done
          exit 1
