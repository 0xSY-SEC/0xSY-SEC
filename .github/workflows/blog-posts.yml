name: Latest blog posts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pull latest posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://0xsy-sec.github.io/posts/index.xml,https://0xsy-sec.github.io/posts/notes/index.xml"
          max_post_count: 5
          template: "$newline- [$title]($url)$newline"
          commit_message: "docs: update latest blog posts"
